services:
  db:
    image: postgres:16.1
    container_name: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./volumes/postgres:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=shareit
      - POSTGRES_USER=mn
      - POSTGRES_PASSWORD=useraqwe
    healthcheck:
      test: pg_isready -q -d $$POSTGRES_DB -U $$POSTGRES_USER
      timeout: 5s
      interval: 5s
      retries: 10
  db-init:
    image: postgres:16.1
    container_name: db-init
    depends_on:
      db:
        condition: service_healthy
    entrypoint:
      - bash
      - -c
      - |
        set -e
        psql postgresql://mn:useraqwe@db:5432/shareit -v ON_ERROR_STOP=1

  server:
    container_name: shareit-sever
    build: ./server
    ports:
      - "9090:9090"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/shareit
      SPRING_DATASOURCE_USERNAME: mn
      SPRING_DATASOURCE_PASSWORD: useraqwe
    depends_on:
      - db
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9090/actuator/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 40s  # Wait for Spring Boot to start

  gateway:
    container_name: shareit-gateway
    build: ./gateway
    ports:
      - "8080:8080"
    environment:
      SERVER_URL: http://server:9090
    depends_on:
      - server