server:
  port: 0

spring:
  h2:
    console:
      enabled: true
      path: /h2-console
  datasource:
    url: jdbc:h2:mem:shareit;DB_CLOSE_DELAY=-1
    username: mn
    password: useraqwe
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      platform: h2
      encoding: UTF-8
      separator: ";"
      continue-on-error: false